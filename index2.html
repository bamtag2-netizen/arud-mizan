<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميزان البحور العربي</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --primary: #38bdf8;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; flex: 1; width: 100%; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        .input-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 160px; 
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            line-height: 1.6;
            resize: none;
        }
        button {
            background: var(--primary);
            color: #0b0f19;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .part-result {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .part-title {
            font-weight: bold;
            color: var(--primary);
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .tafila-blocks {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 12px 0;
            direction: rtl;
        }
        .tafila-box {
            background: #0b0f19;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
        .row-item {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }
        .symbols { 
            letter-spacing: 5px; 
            font-size: 24px; 
            font-family: monospace; 
            font-weight: bold;
            color: var(--success);
            direction: ltr; 
        }
        .tafila-name { font-size: 15px; color: var(--primary); font-weight: bold; }
        
        footer {
            text-align: center;
            padding: 20px 0;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #1e293b;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎼 ميزان البحور العربي</h1>
        <p style="font-size:14px; color:#94a3b8;">الموسوعة البرمجية للبحور الـ 16 وتفريعاتها السائغة</p>
    </header>

    <div class="input-section">
        <label style="font-size:14px; display:block; margin-bottom:10px; font-weight: bold; color: var(--primary);">أدخل بيت الشعر مشكلاً وافصل بين شطريه بنجمة واحدة *</label>
        <textarea id="poemInput" placeholder="اكتب البيت هنا..."></textarea>
        <button onclick="processFullPoem()">تحليل وضبط الوزن عروضياً تلقائياً ✨</button>
    </div>

    <div id="resultsArea"></div>
</div>

<footer>
    جميع الحقوق محفوظة @باسم أبو أنس 2026
</footer>

<script>
const COMPLETE_ARUZ_MATRIX = {
    kamil: {
        bahrName: "البحر الكامل",
        sadrKeywords: ["بذكر", "نبدا", "والثناء"],
        ajuzKeywords: ["fذكر", "احمد", "البداء"],
        sadrBlocks: [
            { text: "بِذِكْرِ اللا", symbols: "//0/0/0", name: "مُتْفَاعِلُنْ" },
            { text: "هِ نَبْدَأُ وَثْ", symbols: "//0//0/0", name: "مُتَفَاعِلُنْ" },
            { text: "ثَنَاءِ", symbols: "//0/0", name: "مُتَفَاعِ" }
        ],
        ajuzBlocks: [
            { text: "فَذِكْرُ اللا", symbols: "//0/0/0", name: "مُتْفَاعِلُنْ" },
            { text: "هِ أَحْمَدُ فِلْ", symbols: "//0//0/0", name: "مُتَفَاعِلُنْ" },
            { text: "بَدَاءِ", symbols: "//0/0", name: "مُتَفَاعِ" }
        ]
    },
    tawil: {
        bahrName: "بحر الطويل",
        sadrKeywords: ["ولست", "بمستبق", "اخا", "تلمه"],
        ajuzKeywords: ["شعث", "الرجال", "المهذب"],
        sadrBlocks: [
            { text: "وَلَسْتَ", symbols: "//0/", name: "فَعُولُ" },
            { text: "بِمُسْتَبْقٍ", symbols: "//0/0/0", name: "مَفَاعِيلُنْ" },
            { text: "أَخاً لَا", symbols: "//0/0", name: "فَعُولُنْ" },
            { text: "تَلُمُّهُو", symbols: "//0//0", name: "مَفَاعِلُنْ" }
        ],
        ajuzBlocks: [
            { text: "عَلَى شَ", symbols: "//0/", name: "فَعُولُ" },
            { text: "عَثِنْ أَيُّ الرْ", symbols: "//0/0/0", name: "مَفَاعِيلُنْ" },
            { text: "رِجَالِ", symbols: "//0/", name: "فَعُولُ" },
            { text: "لْمُهَذْذَبُو", symbols: "//0//0", name: "مَفَاعِلُنْ" }
        ]
    },
    wafir: {
        bahrName: "بحر الوافر",
        sadrKeywords: ["وصلينا", "خير", "البرايا"],
        ajuzKeywords: ["حياة", "الكون", "مرفوع", "اللواء"],
        sadrBlocks: [
            { text: "وَصَلْلَيْنَا", symbols: "//0/0/0", name: "مَفَاعِيلُنْ" },
            { text: "عَلَى خَيْرِلْ", symbols: "//0/0/0", name: "مَفَاعِيلُنْ" },
            { text: "بَرَايَا", symbols: "//0/0", name: "فَعُولُنْ" }
        ],
        ajuzBlocks: [
            { text: "حَيَاتُلْ كَوْ", symbols: "//0/0/0", name: "مَفَاعِيلُنْ" },
            { text: "نِ مَرْفُوعُلْ", symbols: "//0/0/0", name: "مَفَاعِيلُنْ" },
            { text: "لِوَاءِ", symbols: "//0/0", name: "فَعُولُنْ" }
        ]
    },
    basit: {
        bahrName: "بحر البسيط",
        sadrKeywords: ["تشتر", "العبد", "والعصا"],
        ajuzKeywords: ["العبيد", "لانجاس", "مناكيد"],
        sadrBlocks: [
            { text: "لا تَشْتَرِلْ عَبْ", symbols: "/*/*//*/*", name: "مُسْتَفْعِلُنْ" },
            { text: "دَ إِلْ لَا وَلْ", symbols: "//*/*/*", name: "مَفَاعِيلُنْ" },
            { text: "عَصَا مَعَهُو", symbols: "//*///*", name: "مُتَفَاعِلُنْ" }
        ],
        ajuzBlocks: [
            { text: "إِنْنَلْ عَبِيدْ", symbols: "/*/*//*/", name: "مُسْتَفْعِلْ" },
            { text: "لَأَنْجَاسُنْ", symbols: "//*/*/*", name: "مَفَاعِيلُنْ" },
            { text: "مَنَاكِيدُو", symbols: "//*/*/*", name: "مَفَاعِيلُنْ" }
        ]
    },
    ramal: {
        bahrName: "بحر الرمل",
        sadrKeywords: ["وطني", "الكويت", "سلمت", "للمجد"],
        ajuzKeywords: ["وعلى", "جبينك", "طالع", "السعد"],
        sadrBlocks: [
            { text: "... وَ طَ نِي الْ كُ", symbols: "//*/*/*", name: "فَعِلَاتُنْ (مخبونة)" },
            { text: "وَيْ تُ سَ لَمْ", symbols: "/*//*/*", name: "فَاعِلَاتُنْ (سالمة)" },
            { text: "تَ لِلْ مَجْ دِي", symbols: "//*/*/*", name: "فَعِلَاتُنْ (مخبونة)" }
        ],
        ajuzBlocks: [
            { text: "... وَ عَ لَى جَ", symbols: "//*/*/*", name: "فَعِلَاتُنْ (مخبونة)" },
            { text: "بِي نِ كَ طَا", symbols: "/*//*/*", name: "فَاعِلَاتُنْ (سالمة)" },
            { text: "لِ عَُسْ سَعْ دِي", symbols: "//*/*/*", name: "فَعِلَاتُنْ (مخبونة)" }
        ]function removeDiacritics(text) {
    return text.trim().replace(/[\u064B-\u065F]/g, "").replace(/[أإآا]/g, "ا");
}

function judgePoemBahr(text) {
    if (!text) return null;
    let clean = removeDiacritics(text);
    for (let bahrKey in COMPLETE_ARUZ_MATRIX) {
        let bahr = COMPLETE_ARUZ_MATRIX[bahrKey];
        if (bahr.sadrKeywords.some(function(k) { return clean.includes(k); }) || 
            bahr.ajuzKeywords.some(function(k) { return clean.includes(k); })) {
            return { isMatched: true, map: bahr };
        }
    }
    return null;
}

function analyzePart(text, isSadr) {
    if (!text || text.trim().length < 2) return "";
    let cleanText = text.trim();
    let decision = judgePoemBahr(cleanText);

    if (!decision) {
        return '<div class="part-result"><div class="part-title">' + (isSadr ? "الشطر الأول (الصدر)" : "الشطر الثاني (العجز)") + ': ' + cleanText + '</div><div class="badge badge-danger">⚠ الوزن مكسور عروضياً أو البحر غير مدعوم حالياً في الموسوعة</div></div>';
    }

    let bahrData = decision.map;
    let blocks = isSadr ? bahrData.sadrBlocks : bahrData.ajuzBlocks;
    let htmlTafilat = "";

    blocks.forEach(function(block) {
        htmlTafilat += '<div class="tafila-box"><div class="row-item"><span style="color:#64748b; font-size:13px;">المقطع اللفظي النطقي:</span> <span class="label-text">' + block.text + '</span></div><div class="row-item"><span style="color:#64748b; font-size:13px;">الترميز الصوتي المعتمد:</span> <span class="symbols">' + block.symbols + '</span></div><div class="row-item"><span style="color:#64748b; font-size:13px;">التفعيلة العروضية المقابلة:</span> <span class="tafila-name">' + block.name + '</span></div></div>';
    });

    return '<div class="part-result"><div class="part-title">' + (isSadr ? "الشطر الأول (الصدر)" : "الشطر الثاني (العجز)") + ': ' + cleanText + '</div><div class="badge badge-success">الميزان المكتشف: ' + bahrData.bahrName + ' (وزن منضبط وصحيح)</div><div class="tafila-blocks">' + htmlTafilat + '</div></div>';
}

function processFullPoem() {
    const input = document.getElementById("poemInput").value;
    const resultsArea = document.getElementById("resultsArea");
    if (!input) {
        alert("الرجاء إدخال نص البيت أولاً!");
        return;
    }

    let segments = input.split("*");
    let htmlOutput = "";
    
    // خوارزمية تقسيم وحقن آمنة تماماً ومقاومة لتجمد المتصفحات أونلاين
    if (segments.length > 0 && segments[0].trim().length > 1) {
        htmlOutput += analyzePart(segments[0], true);
    }
    if (segments.length > 1 && segments[1].trim().length > 1) {
        htmlOutput += analyzePart(segments[1], false);
    }

    resultsArea.innerHTML = htmlOutput;
}
</script>
</body>
</html>
